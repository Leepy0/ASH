# 정식 릴리스: Windows 러너에서 빌드·테스트·서명 후 릴리스(태그 포함)를 만든다.
# - main push: Directory.Build.props 버전의 릴리스가 없으면 만든다(있으면 건너뜀). 버전만 올려 push하면 릴리스된다.
# - v* 태그 push: 그 태그로 만든다(태그와 버전이 같아야 함).
# 서명 없음: PC가 사내 서버의 매니페스트를 이 릴리스의 같은 파일(github.com)과 대조한다. Secret이 필요 없어 누가 push해도 릴리스된다.
name: release

on:
  push:
    branches: [main]
    paths: ['Directory.Build.props', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 확인
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$v"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "태그 $env:GITHUB_REF_NAME 와 Directory.Build.props 버전 $tag 가 다릅니다" }
          gh release view $tag 2>$null | Out-Null
          $skip = ($LASTEXITCODE -eq 0)
          if ($skip) { Write-Host "$tag 릴리스가 이미 있어 건너뜁니다" }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "skip=$($skip.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'

      - name: 릴리스 노트
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # 직전 태그 이후 커밋 제목 (chore·ci 제외)
          $prev = git describe --tags --abbrev=0 --exclude $env:TAG HEAD 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $msg = (git log --no-merges --format='- %s' $range | Where-Object { $_ -notmatch '^- (chore|ci)' }) -join "`n"
          if (-not $msg) { $msg = "- $env:TAG" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.txt", $msg)
          exit 0

      - name: 빌드·테스트
        if: steps.ver.outputs.skip != 'true'
        # build-release.ps1은 Windows PowerShell 5.1 전용(ReflectionOnlyLoad 사용)
        shell: powershell
        run: |
          try { scripts\build-release.ps1 -Notes "$env:RUNNER_TEMP\notes.txt" }
          catch { Write-Host "::error title=build-release::$($_.Exception.Message -replace '[\r\n]+',' ')"; exit 1 }

      - name: 실패한 테스트 표시
        if: failure() && steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # 빌드 결과로 테스트를 다시 돌려 실패 항목을 annotation으로 남긴다
          dotnet test ASH.sln -c Release --no-build -nologo -v q --logger "trx" --results-directory "$env:RUNNER_TEMP\tr" | Out-Null
          $n = 0
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\tr\*.trx" -ErrorAction SilentlyContinue) {
            [xml]$x = Get-Content $f -Raw
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
              $msg = ([string]$r.Output.ErrorInfo.Message) -replace '[\r\n]+', ' '
              if ($msg.Length -gt 400) { $msg = $msg.Substring(0, 400) }
              Write-Host "::error title=테스트 실패::$($r.testName) — $msg"
              if (++$n -ge 20) { break }
            }
          }
          if ($n -eq 0) { Write-Host "::warning title=테스트::다시 돌렸을 때는 실패한 테스트가 없습니다(간헐 실패 가능)" }
          exit 0

      - name: 릴리스 생성
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Fail($m) { Write-Host "::error title=릴리스 생성::$($m -replace '[\r\n]+',' ')"; exit 1 }
          $v = $env:VERSION
          $files = "ASH-Setup-$v.exe","ASH.json","ASH.Server.json","ASH.Runner.json","ASH-Plugin-$v.zip","ASH-Runner-$v-win-x64.zip","ASH-Server-$v-win-x64.zip" | ForEach-Object { "dist\$_" }
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) { Fail "자산 없음: $($missing -join ', ') / dist 내용: $((Get-ChildItem dist -Name) -join ', ')" }
          # 태그가 없으면 이 커밋에 만든다
          $out = gh release create $env:TAG @files --target $env:GITHUB_SHA --title $env:TAG --notes-file "$env:RUNNER_TEMP\notes.txt" 2>&1
          if ($LASTEXITCODE) { Fail "gh release create 실패(exit $LASTEXITCODE): $($out -join ' ')" }
          Write-Host $out
