# 정식 릴리스: Windows 러너에서 빌드·테스트·서명 후 릴리스(태그 포함)를 만든다.
# - main push: Directory.Build.props 버전의 릴리스가 없으면 만든다(있으면 건너뜀). 버전만 올려 push하면 릴리스된다.
# - v* 태그 push: 그 태그로 만든다(태그와 버전이 같아야 함).
# 서명 키: 저장소 Secret ASH_SIGNING_KEY_PEM (ash-signing.pem 파일 내용 전체)
name: release

on:
  push:
    branches: [main]
    paths: ['Directory.Build.props', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 확인
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$v"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "태그 $env:GITHUB_REF_NAME 와 Directory.Build.props 버전 $tag 가 다릅니다" }
          gh release view $tag 2>$null | Out-Null
          $skip = ($LASTEXITCODE -eq 0)
          if ($skip) { Write-Host "$tag 릴리스가 이미 있어 건너뜁니다" }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "skip=$($skip.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'

      - name: 서명 키 준비
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          PEM: ${{ secrets.ASH_SIGNING_KEY_PEM }}
        run: |
          # 실패 원인을 annotation으로 남긴다(키 내용은 출력하지 않음)
          function Fail($m) { Write-Host "::error title=서명 키::$m"; exit 1 }
          if (-not $env:PEM) { Fail "Secret ASH_SIGNING_KEY_PEM 이 비어 있거나 없습니다 (Settings → Secrets and variables → Actions → Repository secrets 확인)" }
          $pem = $env:PEM.Trim()
          if ($pem -notmatch '^-----BEGIN PRIVATE KEY-----' -or $pem -notmatch '-----END PRIVATE KEY-----$') { Fail "Secret 형식 오류: BEGIN/END PRIVATE KEY 줄 포함 전체를 넣어야 합니다 (길이 $($pem.Length))" }
          $key = Join-Path $env:RUNNER_TEMP 'ash-signing.pem'
          [IO.File]::WriteAllText($key, $pem + "`n")
          "ASH_SIGNING_KEY=$key" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: 릴리스 노트
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # 직전 태그 이후 커밋 제목 (chore·ci 제외)
          $prev = git describe --tags --abbrev=0 --exclude $env:TAG HEAD 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $msg = (git log --no-merges --format='- %s' $range | Where-Object { $_ -notmatch '^- (chore|ci)' }) -join "`n"
          if (-not $msg) { $msg = "- $env:TAG" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.txt", $msg)
          exit 0

      - name: 빌드·테스트·서명
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          try { scripts\build-release.ps1 -Notes "$env:RUNNER_TEMP\notes.txt" }
          catch { Write-Host "::error title=build-release::$($_.Exception.Message -replace '[\r\n]+',' ')"; exit 1 }

      - name: 서명 키 삭제
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\ash-signing.pem" -Force -ErrorAction SilentlyContinue

      - name: 릴리스 생성
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          $files = "ASH-Setup-$v.exe","ASH.json","ASH.json.sig","ASH.Server.json","ASH.Server.json.sig","ASH.Runner.json","ASH.Runner.json.sig","ASH-Plugin-$v.zip","ASH-Runner-$v-win-x64.zip","ASH-Server-$v-win-x64.zip" | ForEach-Object { "dist\$_" }
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "$f 없음" } }
          # 태그가 없으면 이 커밋에 만든다
          gh release create $env:TAG @files --target $env:GITHUB_SHA --title $env:TAG --notes-file "$env:RUNNER_TEMP\notes.txt"
